name: Site — testes, build e deploy no Cloudflare Pages

# A plataforma real do flowaidigital.com.br é Cloudflare Pages, projeto
# `flowai-ecossistema`, em modo Direct Upload. Não há Git Integration ativa e
# não deve haver: este workflow é a ÚNICA fonte de deploy.
#
# ATENÇÃO AO BUILD: `node site/build.mjs` sozinho NÃO basta. Ele gera a home
# como casca de SPA (7 palavras). O passo de prerender é o que coloca o
# conteúdo real no HTML — por isso o build oficial é `npm run build` dentro de
# site/, que roda build + prerender, e por isso o Chromium é instalado aqui.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Testes, build com prerender e checagens de SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            organic-engine/package-lock.json

      # ── dependências ──────────────────────────────────────────────────
      - name: Instalar dependências do site
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Instalar Chromium do Playwright
        working-directory: site
        # instalação determinística: não depende de Chrome pré-existente
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências do Organic Engine
        working-directory: organic-engine
        run: npm ci --no-audit --no-fund

      # ── testes ────────────────────────────────────────────────────────
      - name: Testes do site
        working-directory: site
        run: npm test

      - name: Testes unitários do Engine
        working-directory: organic-engine
        run: npm test

      # ── build oficial: build + prerender ──────────────────────────────
      - name: Build do site (inclui prerender da home)
        working-directory: site
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: npm run build

      # ── o gate que impede a volta da casca ────────────────────────────
      - name: Provar que o prerender rodou
        run: |
          set -e
          node - <<'JS'
          const fs = require("node:fs");
          const html = fs.readFileSync("site/dist/index.html", "utf8");

          const palavras = html
            .replace(/<script[\s\S]*?<\/script>/gi, " ")
            .replace(/<style[\s\S]*?<\/style>/gi, " ")
            .replace(/<[^>]*>/g, " ")
            .split(/\s+/).filter(Boolean).length;

          const falhas = [];

          // 100 não é regra de SEO: é o piso que separa conteúdo real da
          // casca de 7 palavras que a SPA entrega sem prerender.
          if (palavras <= 100) falhas.push(`home tem ${palavras} palavras — o prerender não rodou`);

          const h1 = (html.match(/<h1[\s>]/g) || []).length;
          if (h1 !== 1) falhas.push(`home tem ${h1} H1, esperado 1`);

          if (!/rel="canonical"/.test(html)) falhas.push("home sem canonical");

          const tipos = [...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)]
            .map((m) => { try { return JSON.parse(m[1].replace(/\\u003c/g, "<"))["@type"]; } catch { return null; } });
          if (!tipos.includes("Organization")) falhas.push("home sem Organization");
          if (!tipos.includes("WebSite")) falhas.push("home sem WebSite");
          if (tipos.filter(t => t === "Organization").length > 1) falhas.push("Organization duplicada na home");

          if (falhas.length) {
            for (const f of falhas) console.error(`::error::${f}`);
            process.exit(1);
          }
          console.log(`prerender confirmado: ${palavras} palavras, 1 H1, canonical, Organization + WebSite`);
          JS

      - name: Checagens de SEO no artefato gerado
        run: |
          set -e
          cd site/dist

          echo "— 404.html existe"
          test -f 404.html

          echo "— _redirects não reintroduziu o catch-all 200"
          if grep -qE '^\s*/\*\s+/index\.html\s+200' _redirects; then
            echo "::error::catch-all 200 voltou ao _redirects — isso recria o soft-404 universal"
            exit 1
          fi

          echo "— toda URL do sitemap corresponde a um arquivo"
          grep -oE '<loc>[^<]+</loc>' sitemap.xml \
            | sed -E 's#</?loc>##g; s#https://flowaidigital.com.br##' \
            | while read -r rota; do
                alvo="${rota#/}index.html"
                [ "$rota" = "/" ] && alvo="index.html"
                if [ ! -f "$alvo" ]; then
                  echo "::error::sitemap aponta para $rota, que não foi gerada"
                  exit 1
                fi
              done

          echo "— robots libera busca e bloqueia treinamento"
          for bot in Googlebot Bingbot OAI-SearchBot ChatGPT-User Claude-SearchBot Claude-User PerplexityBot Perplexity-User; do
            grep -A1 "^User-agent: $bot$" robots.txt | grep -q "^Allow: /" \
              || { echo "::error::$bot deveria estar liberado no robots"; exit 1; }
          done
          for bot in GPTBot ClaudeBot Google-Extended; do
            grep -A1 "^User-agent: $bot$" robots.txt | grep -q "^Disallow: /" \
              || { echo "::error::$bot deveria estar bloqueado no robots"; exit 1; }
          done

          echo "— money pages têm conteúdo no HTML, sem depender de JavaScript"
          for f in */index.html; do
            [ "$f" = "blog/index.html" ] && continue
            palavras=$(sed 's/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' "$f" | wc -w)
            if [ "$palavras" -lt 250 ]; then
              echo "::error::$f só tem $palavras palavras no HTML"
              exit 1
            fi
            grep -q '<link rel="canonical"' "$f" || { echo "::error::$f sem canonical"; exit 1; }
            grep -q '<h1' "$f" || { echo "::error::$f sem H1"; exit 1; }
          done

          echo "Todas as checagens de SEO passaram."

      # dist NUNCA vem de cache: é sempre o artefato deste build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  preview:
    name: Deploy de preview
    needs: build
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      - name: Publicar preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}

  production:
    name: Deploy de produção
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      - name: Publicar em produção
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main

      - name: Smoke test pós-deploy
        run: |
          set -e
          home=000
          for i in $(seq 1 20); do
            sleep 15
            home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://flowaidigital.com.br/ || echo 000)
            [ "$home" = "200" ] && break
            echo "tentativa $i: home=$home"
          done
          [ "$home" = "200" ] || { echo "::error::home não voltou a responder 200"; exit 1; }

          echo "— home serve conteúdo, não a casca da SPA"
          palavras=$(curl -s --max-time 25 https://flowaidigital.com.br/ \
            | sed 's/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' | wc -w)
          if [ "$palavras" -lt 100 ]; then
            echo "::error::home em produção com $palavras palavras — a casca voltou"
            exit 1
          fi
          echo "home com $palavras palavras."

          echo "— 404 real em URL inexistente"
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://flowaidigital.com.br/rota-inexistente-smoke-test-$(date +%s)/")
          [ "$codigo" = "404" ] || { echo "::error::URL inexistente devolveu $codigo, esperado 404"; exit 1; }

          echo "— www redireciona para o apex em um salto"
          loc=$(curl -sI --max-time 20 https://www.flowaidigital.com.br/agentes-de-ia-para-empresas/ \
            | grep -i '^location:' | sed 's/[Ll]ocation: *//; s/\r//')
          case "$loc" in
            https://flowaidigital.com.br/agentes-de-ia-para-empresas/) echo "www ok" ;;
            *) echo "::error::www não redirecionou corretamente (Location: $loc)"; exit 1 ;;
          esac

          echo "Smoke test passou."

      - name: Verificar acesso dos crawlers
        continue-on-error: true
        working-directory: organic-engine
        run: |
          npm ci --no-audit --no-fund
          node src/cli.mjs crawlers https://flowaidigital.com.br/
