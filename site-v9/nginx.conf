server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # health check usado pelo HEALTHCHECK do Dockerfile e pelo EasyPanel
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # assets com hash no nome (Next.js) — cache longo e imutável
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /scenes/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # export estático do Next.js com trailingSlash: /rota/ -> /rota/index.html
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
